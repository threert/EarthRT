[package]
name = "earthrt-core"
version = "0.1.0"
edition = "2021"
description = "The EarthRT app's globe view: ThreeRT's live path tracer running the globe's scene script (app/), with the host channel answered natively (assets.*, net.fetch), behind a C ABI"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
threert-render = { path = "../../engine/renderer", default-features = false, features = ["audio", "assets"] }
wgpu = "30"
bytemuck = "1"
serde_json = "1"
anyhow = "1"
# net.fetch (src/net.rs) on the same HTTP client as the engine's `assets` module (assets.*): ureq on rustls with the
# ring provider and the webpki roots.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
opt-level = 3
debug = false
lto = "thin"

# The engine's patched crates; cargo reads this table from the crate it builds (engine/renderer/Cargo.toml's).
[patch.crates-io]
glamx = { path = "../../engine/renderer/third_party/glamx" }
parry3d = { path = "../../engine/renderer/third_party/parry3d" }
wgpu = { path = "../../engine/renderer/third_party/wgpu" }
wgpu-core = { path = "../../engine/renderer/third_party/wgpu-core" }
