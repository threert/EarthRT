[package]
name = "earthrt-core"
version = "0.1.0"
edition = "2021"
description = "The EarthRT app's globe view: ThreeRT's live path tracer running the globe's scene script (app/), with the host channel answered natively (assets.*, net.fetch), behind a C ABI"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
threert-render = { path = "../../engine/renderer", default-features = false, features = ["audio"] }
wgpu = "30"
bytemuck = "1"
serde_json = "1"
anyhow = "1"
# assets.* and net.fetch (src/assets.rs, src/net.rs): until the engine's own `assets` library module is in the pinned
# engine (meshy-dev/ThreeRT #283), the core carries a module of the same shape. TLS is rustls with the ring provider
# and the webpki roots, as the engine's.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
lto = "thin"

# The engine's patched crates; cargo reads this table from the crate it builds (engine/renderer/Cargo.toml's).
[patch.crates-io]
glamx = { path = "../../engine/renderer/third_party/glamx" }
parry3d = { path = "../../engine/renderer/third_party/parry3d" }
wgpu = { path = "../../engine/renderer/third_party/wgpu" }
wgpu-core = { path = "../../engine/renderer/third_party/wgpu-core" }
